# Remote resources (Tito ticket data) are cached by Hugo; keep it short so a
# local `hugo server` does not show stale prices forever.
[caches.getresource]
  maxAge = "1h"

# Edition in planning (params.editionStatus = "planning"): the programme
# sections are not built, so they are neither published nor listed in the
# sitemap. Remove this block when the edition is announced.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    path = "{/cfp,/cfp/**,/dublin,/dublin/**,/grid,/grid/**,/schedule,/schedule/**,/speakers,/speakers/**,/sponsors,/sponsors/**,/venue,/venue/**}"
