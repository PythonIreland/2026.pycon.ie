baseURL = "https://2026.pycon.ie/"
locale = "en"
title = "PyCon Ireland 2026"
enableGitInfo = true

[taxonomies]

[build]
  [build.buildStats]
    enable = true

  [[build.cachebusters]]
    source = "assets/css/main\\.css"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "hugo_stats\\.json"
    target = "css"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^COMMIT_REF$', '^DEPLOY_ID$']

[params]
  description = "PyCon Ireland 2026 — Ireland's premier Python conference. Join Python developers for talks, workshops, and networking in Dublin's city centre."
  dateHuman = "21 November 2026"
  eventDate = "2026-11-21"

  # Event dates in ISO 8601 format (for structured data)
  eventStartDate = "2026-11-21T09:00:00+01:00"
  eventEndDate = "2026-11-21T18:00:00+01:00"

  # Venue information
  venue = "Chartered Accountants House"
  venueAddress = "47-49 Pearse St, Dublin 2, D02 YN40, Ireland"
  venueStreetAddress = "47-49 Pearse Street"
  venueCity = "Dublin"
  venuePostalCode = "D02 YN40"
  venueRegion = "Dublin"
  venueCountry = "IE"
  venueMapLat = 53.344289
  venueMapLon = -6.247827
  venuePhone = "+353 1 637 7200"
  venueWebsite = "https://www.charteredaccountants.ie/chartered-accountants-house/home"

  # Organizer information
  organizerName = "Python Ireland"
  organizerFullName = "Python Ireland Developers CLG"
  organizerUrl = "https://python.ie/"
  croNumber = "559983"

  # CFP status: "soon", "open", "closed" (temporarily), or "finished"
  cfpStatus = "finished"
  cfpUrl = "https://sessionize.com/pycon-ireland-2026/"
  cfpOpens = "2026-05-25"
  cfpCloses = "2026-08-30"
  ticketsUrl = "https://ti.to/python-ireland/pycon-ireland-2026"  # Set to Tito/Eventbrite URL when tickets go on sale
  ticketsValidFrom = "2026-10-01"  # Date pricing tiers were announced; required by Google's Offer.validFrom check

  # Contact & social
  email = "pycon2026@python.ie"
  bskyUrl = "https://bsky.app/profile/python-ireland.bsky.social"
  bskyHandle = "@python-ireland.bsky.social"
  twitterUrl = "https://x.com/pythonireland"
  twitterHandle = "@pythonireland"
  mastodonHandle = "@Python_Ireland"
  mastodonUrl = "https://mastodon.ie/@Python_Ireland"
  youtubeUrl = "https://www.youtube.com/@PythonIreland"
  linkedinUrl = "https://www.linkedin.com/company/python-ireland"
  ogImage = "/img/og-image.webp"

  [params.hero]
    title = "PyCon Ireland 2026"
    subtitle = "Ireland's Premier Python Conference"
    date = "21 November 2026"
    location = "Dublin's City Centre"

  [params.stats]
    # attendees = 500  # TODO: restore once attendance number is confirmed
    speakers = 50
    tracks = 3
    days = 1

  [[params.tickets]]
    name = "Student"
    price = 35
    currency = "EUR"
    features = ["Full conference access", "Lunch & refreshments", "Community networking"]
    highlight = false

  # [[params.tickets]]
  #   name = "Early Bird"
  #   price = 49
  #   currency = "EUR"
  #   features = ["Full conference access", "Lunch & refreshments", "Conference t-shirt", "Workshop access"]
  #   highlight = true

  [[params.tickets]]
    name = "General"
    price = 59
    currency = "EUR"
    features = ["Full conference access", "Lunch & refreshments", "Workshop access"]
    highlight = false

  [[params.tickets]]
    name = "Corporate"
    price = 159
    currency = "EUR"
    features = ["Full conference access", "Lunch & refreshments", "Workshop access", "Priority seating", "Networking reception"]
    highlight = false

[menus]
  [[menus.main]]
    name = "Tickets"
    url = "/#tickets"
    weight = 10
  [[menus.main]]
    name = "Call for Proposals"
    url = "/cfp/"
    weight = 20
  # [[menus.main]]
  #   name = "Sponsors"
  #   url = "/sponsors/"
  #   weight = 40
  [[menus.main]]
    identifier = "venue"
    name = "Venue"
    weight = 50

  [[menus.main]]
    name = "Venue"
    url = "/venue/"
    parent = "venue"
    weight = 1

  [[menus.main]]
    name = "Dublin"
    url = "/dublin/"
    parent = "venue"
    weight = 2
  [[menus.main]]
    identifier = "community"
    name = "Community"
    weight = 60

  [[menus.main]]
