# Dependabot only watches the default branch (main), which holds the shared
# code for every edition. Cherry-pick updates into edition branches if needed.
# Hugo and Python versions (mise.toml, netlify.toml) are not covered: bump them by hand.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
